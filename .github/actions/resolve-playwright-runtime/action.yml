name: Resolve Playwright runtime
description: Resolve one immutable runtime image for the container E2E cohort
inputs:
  token:
    description: Read-only GitHub token for same-repository package access
    required: false
outputs:
  digest:
    description: Verified runtime manifest digest
    value: ${{ steps.resolve.outputs.digest }}
  ref:
    description: Immutable runtime image reference
    value: ${{ steps.resolve.outputs.ref }}
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Resolve immutable Playwright runtime image
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        image=ghcr.io/kdlbs/kandev-ci:runtime-latest
        digest="$(bash .github/scripts/resolve-image-digest.sh "$image")"
        {
          echo "digest=$digest"
          echo "ref=$image@$digest"
        } >> "$GITHUB_OUTPUT"
